<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#15111a">
<meta name="description" content="Reportes de ventas de Shop Ofe Trujillo">

<title>Reportes 📊 | Shop Ofe Trujillo</title>

<link rel="stylesheet" href="styles.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root{
    --rosa:#ff2f92;
    --rosa-claro:#ff72b8;
    --rosa-suave:#fff0f7;
    --morado:#8e44ad;
    --morado-2:#b45ad6;
    --oscuro:#15111a;
    --oscuro-2:#211827;
    --blanco:#ffffff;
    --gris:#746d78;
    --fondo:#faf8fa;
    --borde:rgba(21,17,26,.08);
    --sombra:0 18px 50px rgba(21,17,26,.08);
    --sombra-fuerte:0 25px 70px rgba(21,17,26,.16);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:"DM Sans",sans-serif;
    color:var(--oscuro);
    background:
        radial-gradient(circle at 5% 5%,rgba(255,47,146,.09),transparent 27%),
        radial-gradient(circle at 95% 15%,rgba(142,68,173,.09),transparent 27%),
        var(--fondo);
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(21,17,26,.97);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.header-container{
    width:min(1250px,94%);
    min-height:76px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    color:#fff;
    text-decoration:none;
}

.logo-icon{
    width:43px;
    height:43px;
    display:grid;
    place-items:center;
    border-radius:14px;
    color:#fff;
    background:linear-gradient(135deg,var(--rosa),var(--morado));
    box-shadow:0 8px 24px rgba(255,47,146,.28);
}

.logo-text{
    font-family:"Playfair Display",serif;
    font-size:22px;
    font-weight:700;
}

.logo-subtitle{
    display:block;
    margin-top:1px;
    color:rgba(255,255,255,.55);
    font-family:"DM Sans",sans-serif;
    font-size:8px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-btn{
    min-height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:0 15px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    color:#fff;
    background:rgba(255,255,255,.07);
    text-decoration:none;
    font-size:12px;
    font-weight:800;
    transition:.25s ease;
}

.header-btn:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.13);
}

.header-btn.primary{
    border:0;
    background:linear-gradient(135deg,var(--rosa),var(--morado));
    box-shadow:0 8px 22px rgba(255,47,146,.22);
}

/* =========================
   CONTENEDOR
========================= */

.contenedor{
    width:min(1150px,94%);
    margin:auto;
    padding:40px 0 70px;
}

/* =========================
   HERO
========================= */

.report-header{
    position:relative;
    overflow:hidden;
    padding:40px;
    margin-bottom:22px;
    border-radius:27px;
    color:#fff;
    background:
        radial-gradient(circle at 10% 20%,rgba(255,255,255,.16),transparent 27%),
        radial-gradient(circle at 90% 90%,rgba(255,255,255,.1),transparent 30%),
        linear-gradient(135deg,var(--oscuro),#36172f 55%,var(--morado));
    box-shadow:var(--sombra-fuerte);
}

.report-header::before{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    right:-140px;
    top:-160px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
}

.report-header-content{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.report-title{
    display:flex;
    align-items:center;
    gap:16px;
}

.report-icon{
    width:65px;
    height:65px;
    flex:0 0 65px;
    display:grid;
    place-items:center;
    border-radius:20px;
    color:#fff;
    background:linear-gradient(135deg,var(--rosa),var(--morado-2));
    box-shadow:0 14px 30px rgba(255,47,146,.25);
    font-size:26px;
}

.report-header h1{
    font-family:"Playfair Display",serif;
    font-size:clamp(30px,4vw,43px);
    line-height:1.1;
}

.report-header p{
    margin-top:6px;
    color:rgba(255,255,255,.65);
    font-size:13px;
}

.date-badge{
    padding:10px 14px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;
    color:rgba(255,255,255,.85);
    background:rgba(255,255,255,.08);
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
}

/* =========================
   ACCIONES
========================= */

.actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-bottom:20px;
}

.btn{
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 18px;
    border:0;
    border-radius:12px;
    color:#fff;
    background:linear-gradient(135deg,var(--rosa),var(--morado));
    box-shadow:0 10px 22px rgba(255,47,146,.18);
    font-family:inherit;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
    transition:.25s ease;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 28px rgba(255,47,146,.25);
}

.btn-secondary{
    color:var(--oscuro);
    background:#fff;
    border:1px solid var(--borde);
    box-shadow:var(--sombra);
}

/* =========================
   REPORTE
========================= */

.card{
    min-height:180px;
    padding:25px;
    border:1px solid var(--borde);
    border-radius:23px;
    background:rgba(255,255,255,.94);
    box-shadow:var(--sombra);
    overflow-x:auto;
}

/* Compatible con contenido generado por reportes.js */

.card table{
    width:100%;
    min-width:650px;
    border-collapse:collapse;
}

.card th{
    padding:13px 12px;
    color:#fff;
    background:linear-gradient(135deg,var(--oscuro),var(--morado));
    font-size:11px;
    font-weight:800;
    text-align:left;
    white-space:nowrap;
}

.card th:first-child{
    border-radius:10px 0 0 10px;
}

.card th:last-child{
    border-radius:0 10px 10px 0;
}

.card td{
    padding:13px 12px;
    border-bottom:1px solid #eee9ee;
    color:#59535d;
    font-size:12px;
}

.card tr:hover td{
    background:#fff7fb;
}

.card strong{
    color:var(--oscuro);
}

/* =========================
   TOTAL
========================= */

.total-dia{
    margin-top:18px;
    padding:25px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    border-radius:21px;
    color:#fff;
    background:
        radial-gradient(circle at 100% 0,rgba(255,255,255,.15),transparent 30%),
        linear-gradient(135deg,var(--rosa),var(--morado));
    box-shadow:0 18px 40px rgba(255,47,146,.2);
    font-size:14px;
    font-weight:800;
}

.total-dia::before{
    content:"Total de ventas del día";
    color:rgba(255,255,255,.75);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.8px;
}

#totalDia{
    font-size:30px;
    font-weight:900;
}

/* =========================
   EMPTY
========================= */

.empty-report{
    min-height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:8px;
    color:var(--gris);
    text-align:center;
}

.empty-report i{
    width:50px;
    height:50px;
    display:grid;
    place-items:center;
    border-radius:15px;
    color:var(--rosa);
    background:var(--rosa-suave);
    font-size:20px;
}

.empty-report strong{
    color:var(--oscuro);
    font-size:13px;
}

.empty-report span{
    font-size:11px;
}

/* =========================
   FOOTER
========================= */

footer{
    padding:28px 20px;
    color:rgba(255,255,255,.65);
    background:var(--oscuro);
    text-align:center;
}

footer strong{
    display:block;
    margin-bottom:4px;
    color:#fff;
    font-family:"Playfair Display",serif;
    font-size:18px;
}

footer span{
    font-size:11px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    .header-container{
        min-height:68px;
    }

    .header-actions .header-btn span{
        display:none;
    }

    .header-btn{
        width:42px;
        padding:0;
    }

    .report-header{
        padding:30px 25px;
    }

    .report-header-content{
        align-items:flex-start;
        flex-direction:column;
    }

    .date-badge{
        width:100%;
        text-align:center;
    }
}

@media(max-width:600px){

    .contenedor{
        width:94%;
        padding:25px 0 50px;
    }

    .logo-text{
        font-size:18px;
    }

    .logo-icon{
        width:38px;
        height:38px;
        border-radius:12px;
    }

    .logo-subtitle{
        display:none;
    }

    .report-header{
        border-radius:21px;
        padding:25px 19px;
    }

    .report-title{
        gap:12px;
    }

    .report-icon{
        width:55px;
        height:55px;
        flex-basis:55px;
        border-radius:17px;
        font-size:21px;
    }

    .report-header h1{
        font-size:29px;
    }

    .report-header p{
        font-size:11px;
    }

    .actions{
        display:grid;
        grid-template-columns:1fr;
    }

    .btn{
        width:100%;
    }

    .card{
        padding:13px;
        border-radius:18px;
    }

    .total-dia{
        padding:20px;
        align-items:flex-start;
        flex-direction:column;
    }

    #totalDia{
        font-size:27px;
    }
}

@media(max-width:390px){

    .header-btn{
        width:37px;
        min-height:37px;
    }

    .logo-text{
        font-size:16px;
    }

    .report-header h1{
        font-size:26px;
    }

    .report-icon{
        width:50px;
        height:50px;
        flex-basis:50px;
    }

    .total-dia{
        padding:17px;
    }

    #totalDia{
        font-size:24px;
    }
}

/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }

}

</style>
</head>

<body>

<header class="header">

    <div class="header-container">

        <a href="panel.html" class="logo">

            <span class="logo-icon">
                <i class="fas fa-chart-column"></i>
            </span>

            <span>
                <span class="logo-text">Shop Ofe Trujillo</span>
                <span class="logo-subtitle">Administración · Reportes</span>
            </span>

        </a>

        <div class="header-actions">

            <a href="panel.html" class="header-btn primary">
                <i class="fas fa-arrow-left"></i>
                <span>Panel</span>
            </a>

            <a href="corte.html" class="header-btn">
                <i class="fas fa-cash-register"></i>
                <span>Corte</span>
            </a>

        </div>

    </div>

</header>


<main class="contenedor">

    <section class="report-header">

        <div class="report-header-content">

            <div class="report-title">

                <div class="report-icon">
                    <i class="fas fa-chart-pie"></i>
                </div>

                <div>

                    <h1>Reportes del día</h1>

                    <p>
                        Consulta y administra el resumen de ventas.
                    </p>

                </div>

            </div>

            <div class="date-badge">
                <i class="far fa-calendar"></i>
                Reporte diario
            </div>

        </div>

    </section>


    <div class="actions">

        <button
            type="button"
            class="btn"
            onclick="descargarPDF()">

            <i class="fas fa-file-pdf"></i>

            Descargar PDF

        </button>

    </div>


    <section
        id="reportes"
        class="card">

        <div class="empty-report">

            <i class="fas fa-chart-simple"></i>

            <strong>Cargando reporte...</strong>

            <span>
                Espera mientras se consultan las ventas.
            </span>

        </div>

    </section>


    <div class="total-dia">

        <span>
            Total:
            <strong style="display:none;">
                Total de ventas del día
            </strong>
        </span>

        <span>
            $<span id="totalDia">0</span>
        </span>

    </div>

</main>


<footer>

    <strong>Shop Ofe Trujillo 💖</strong>

    <span>
        Sistema de reportes · © 2026
    </span>

</footer>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module" src="reportes.js"></script>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
if(typeof emailjs !== "undefined"){
    emailjs.init("TU_PUBLIC_KEY");
}
</script>

</body>
</html>
