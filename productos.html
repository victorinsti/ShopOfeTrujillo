<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#15111a">
<title>Catálogo | Shop Ofe Trujillo</title>

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<!-- AGREGA ESTAS 2 LÍNEAS EN TODAS TUS PÁGINAS -->

<link rel="stylesheet" href="chatbot.css">

<script src="chatbot.js"></script>
<style>
:root{
    --rosa:#ff2f92;
    --rosa2:#ff72b8;
    --morado:#8e44ad;
    --oscuro:#15111a;
    --gris:#6f6872;
    --fondo:#faf8fa;
    --borde:rgba(21,17,26,.08);
    --sombra:0 18px 45px rgba(21,17,26,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'DM Sans',sans-serif;
    background:
        radial-gradient(circle at top left,rgba(255,47,146,.08),transparent 25%),
        radial-gradient(circle at top right,rgba(142,68,173,.08),transparent 25%),
        var(--fondo);
    color:var(--oscuro);
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:999;
    background:rgba(21,17,26,.96);
    backdrop-filter:blur(18px);
}

.container{
    width:min(1200px,92%);
    margin:auto;
}

.header-box{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo a{
    color:#fff;
    text-decoration:none;
    font-family:'Playfair Display',serif;
    font-size:27px;
    font-weight:700;
}

.menu-toggle{
    display:none;
    color:#fff;
    font-size:24px;
    cursor:pointer;
}

nav ul{
    display:flex;
    list-style:none;
    gap:18px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:.3s;
}

nav a:hover{
    color:var(--rosa2);
}

/* HERO */
.hero{
    width:min(1200px,92%);
    margin:35px auto 25px;
    border-radius:28px;
    padding:70px 25px;
    text-align:center;
    color:#fff;
    background:
        radial-gradient(circle at top left,rgba(255,255,255,.12),transparent 25%),
        linear-gradient(135deg,#15111a,#441b54,#ff2f92);
    box-shadow:0 25px 70px rgba(21,17,26,.18);
}

.hero h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(34px,6vw,58px);
    margin-bottom:12px;
}

.hero p{
    color:rgba(255,255,255,.82);
    font-size:16px;
}

/* SEARCH */
.search-box{
    width:min(1200px,92%);
    margin:auto;
    margin-bottom:18px;
    position:relative;
}

.search-box i{
    position:absolute;
    left:18px;
    top:16px;
    color:var(--rosa);
}

.search-box input{
    width:100%;
    height:52px;
    border:none;
    border-radius:15px;
    padding:0 20px 0 48px;
    background:#fff;
    box-shadow:var(--sombra);
    font-size:15px;
    outline:none;
}

/* FILTER */
.filter-bar{
    width:min(1200px,92%);
    margin:auto;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    padding-bottom:25px;
}

.filter-btn{
    border:none;
    padding:11px 22px;
    border-radius:30px;
    background:#fff;
    color:var(--rosa);
    font-weight:700;
    cursor:pointer;
    box-shadow:var(--sombra);
    transition:.25s;
}

.filter-btn.active,
.filter-btn:hover{
    background:linear-gradient(135deg,var(--rosa),var(--morado));
    color:#fff;
}

/* GRID */
.catalog-container{
    width:min(1200px,92%);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:22px;
    padding-bottom:60px;
}

.item-card{
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--sombra);
    transition:.25s;
    display:flex;
    flex-direction:column;
}

.item-card:hover{
    transform:translateY(-8px);
}

.item-img{
    width:100%;
    height:270px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
}

.item-img img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.item-info{
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
}

.tipo{
    font-size:11px;
    color:var(--rosa);
    font-weight:800;
    text-transform:uppercase;
}

.item-info h3{
    font-size:17px;
    min-height:42px;
}

.descripcion{
    color:var(--gris);
    font-size:13px;
    line-height:1.5;
    min-height:38px;
}

.item-price{
    color:var(--rosa);
    font-size:24px;
    font-weight:800;
}

.btn-wa{
    margin-top:auto;
    text-decoration:none;
    background:linear-gradient(135deg,#25d366,#20b858);
    color:#fff;
    text-align:center;
    padding:13px;
    border-radius:12px;
    font-weight:700;
    transition:.25s;
}

.btn-wa:hover{
    transform:scale(1.02);
}

.sin-productos{
    grid-column:1/-1;
    background:#fff;
    border-radius:18px;
    padding:60px 20px;
    text-align:center;
    box-shadow:var(--sombra);
}

.sin-productos i{
    font-size:45px;
    color:var(--rosa);
    margin-bottom:15px;
}

/* FOOTER */
footer{
    background:#15111a;
    color:#fff;
    text-align:center;
    padding:25px;
    margin-top:40px;
}

/* RESPONSIVE */
@media(max-width:900px){

.menu-toggle{
display:block;
}

nav{
display:none;
position:absolute;
top:76px;
left:0;
width:100%;
background:#15111a;
padding:15px;
}

nav.active{
display:block;
}

nav ul{
flex-direction:column;
gap:10px;
}

.hero{
padding:50px 20px;
}

.catalog-container{
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.item-img{
height:190px;
}

}

@media(max-width:520px){

.catalog-container{
grid-template-columns:1fr;
}

.item-img{
height:250px;
}

.logo a{
font-size:22px;
}

}
</style>
</head>

<body>

<header>
<div class="container header-box">

<div class="logo">
<a href="index.html">Shop Ofe Trujillo</a>
</div>

<div class="menu-toggle" onclick="toggleMenu()">
<i class="fas fa-bars"></i>
</div>

<nav id="menu">
<ul>
<li><a href="index.html">Inicio</a></li>
<li><a href="productos.html">Productos</a></li>
<li><a href="index.html#envios">Envíos</a></li>
<li><a href="index.html#novedades">Nosotros</a></li>
<li><a href="login.html">Clientes</a></li>
<li><a href="galeria.html">Galería</a></li>
<li><a href="index.html#contacto">Contacto</a></li>
<li><a href="acceso.html">Acceso</a></li>
</ul>
</nav>

</div>
</header>

<section class="hero">
<h1>Nuestra Colección</h1>
<p>Descubre maquillaje, accesorios y novedades con la mejor calidad 💖</p>
</section>

<div class="search-box">
<i class="fas fa-search"></i>
<input type="text" id="buscar" placeholder="Buscar productos...">
</div>

<div class="filter-bar">
<button class="filter-btn active" onclick="filtrar('todos',this)">Todos</button>
<button class="filter-btn" onclick="filtrar('producto',this)">Productos</button>
<button class="filter-btn" onclick="filtrar('accesorio',this)">Accesorios</button>
</div>

<section class="catalog-container" id="catalogo"></section>

<footer>
© 2026 Shop Ofe Trujillo · Todos los derechos reservados
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBDAOW-qrvxTcJVM4QNWPQvrmbz8wcAQLM",
authDomain:"trujillo-digital-hub.firebaseapp.com",
projectId:"trujillo-digital-hub",
storageBucket:"trujillo-digital-hub.firebasestorage.app",
messagingSenderId:"162799375782",
appId:"1:162799375782:web:2be9127bfeaa613fd6ab67"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let productos=[];
let filtroActual="todos";

async function cargarCatalogo(){

const snap=await getDocs(collection(db,"productos"));

productos=snap.docs.map(doc=>doc.data());

mostrar();

}

function mostrar(){

const texto=document.getElementById("buscar").value.toLowerCase();

let lista=productos.filter(p=>{

const coincideFiltro=filtroActual==="todos" || p.tipo===filtroActual;

const coincideBusqueda=(p.nombre||"").toLowerCase().includes(texto) ||
(p.descripcion||"").toLowerCase().includes(texto);

return coincideFiltro && coincideBusqueda;

});

const catalogo=document.getElementById("catalogo");

catalogo.innerHTML="";

if(lista.length===0){

catalogo.innerHTML=`
<div class="sin-productos">
<i class="fas fa-box-open"></i>
<h3>Sin productos disponibles</h3>
<p>No encontramos resultados.</p>
</div>`;

return;
}

lista.forEach(item=>{

catalogo.innerHTML+=`
<div class="item-card">

<div class="item-img">
<img src="${item.imagen}" alt="${item.nombre}">
</div>

<div class="item-info">

<div class="tipo">${item.tipo||"Producto"}</div>

<h3>${item.nombre}</h3>

<p class="descripcion">${item.descripcion||"Producto disponible en Shop Ofe Trujillo."}</p>

<div class="item-price">$${item.precio}</div>

<a class="btn-wa"
target="_blank"
href="https://wa.me/529222174646?text=Hola%20Shop%20Ofe%20Trujillo%20💖,%20me%20interesa:%20${encodeURIComponent(item.nombre)}">
<i class="fab fa-whatsapp"></i> Comprar por WhatsApp
</a>

</div>
</div>`;
});

}

window.filtrar=(tipo,btn)=>{

filtroActual=tipo;

document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

mostrar();

};

document.getElementById("buscar").addEventListener("input",mostrar);

cargarCatalogo();

</script>

<script>
function toggleMenu(){
document.getElementById("menu").classList.toggle("active");
}
</script>

</body>
</html>
