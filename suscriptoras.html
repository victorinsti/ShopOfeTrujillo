<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club VIP 💎</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#ff4da6,#ff99cc);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:90%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#ff4da6;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#ff1493,#ff69b4);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.02);
}

.msg{
    margin-top:15px;
    text-align:center;
    color:#666;
}

</style>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<header>
<div class="container">

    <div class="logo">
        <a href="index.html">Shop Ofe Trujillo</a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
       <li><a href="productos.html">Productos</a></li>
            <li><a href="index.html#envios">Envíos</a></li>
            <li><a href="index.html#novedades">Nosotros</a></li>
            <li><a href="login.html">Clientes</a></li>
            <li><a href="galeria.html#anuncios">Anuncios</a></li>
            <li><a href="galeria.html#galeria">Galería</a></li>
            <li><a href="index.html#contacto">Contacto</a></li>
            <li><a href="acceso.html">Acceso</a></li>
        </ul>
    </nav>

</div>
</header>
<body>

<div class="box">

<h1>💎 Club VIP</h1>

<input type="email" id="email" placeholder="Correo">
<input type="password" id="pass" placeholder="Contraseña">


<button onclick="registrar()">✨ Crear cuenta</button>

<button onclick="login()">🔐 Iniciar sesión</button>

<div class="msg" id="msg"></div>
<div id="loader" style="
display:none;
text-align:center;
margin-top:10px;
color:#ff1493;
font-weight:bold;
">
⏳ Cargando...
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDAOW-qrvxTcJVM4QNWPQvrmbz8wcAQLM",
  authDomain: "trujillo-digital-hub.firebaseapp.com",
  projectId: "trujillo-digital-hub",
  storageBucket: "trujillo-digital-hub.firebasestorage.app",
  messagingSenderId: "162799375782",
  appId: "1:162799375782:web:2be9127bfeaa613fd6ab67"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.registrar = async () => {

let email =
document.getElementById("email").value.trim();

let pass =
document.getElementById("pass").value.trim();

const loader =
document.getElementById("loader");

loader.style.display = "block";

if(!email || !pass){

    loader.style.display = "none";

    return alert("Completa todos los campos");
}

try{

    const ref =
    doc(db,"vip_clientas",email);

    const existe =
    await getDoc(ref);

    if(existe.exists()){

        loader.style.display = "none";

        return alert("⚠️ Ya existe una cuenta");
    }

    await setDoc(ref,{

        email,
        pass,

        nombre:"",
        telefono:"",
        cumpleanos:"",
        ciudad:"",

        foto:"img/vip-logo.png",

        nivel:"Silver",
        estado:"pendiente",
        puntos:0,

        aprobada:false,

        fechaRegistro:new Date().toISOString(),
        ultimaConexion:new Date().toLocaleString()

    });

    loader.style.display = "none";

    document.getElementById("msg").innerHTML =
    "💖 Cuenta enviada para aprobación";

}catch(error){

    console.error(error);

    loader.style.display = "none";

    alert("❌ Error al registrar");

}

};

window.login = async () => {

let email =
document.getElementById("email").value.trim();

let pass =
document.getElementById("pass").value.trim();

const loader =
document.getElementById("loader");

loader.style.display = "block";

if(!email || !pass){

    loader.style.display = "none";

    return alert("Completa todos los campos");
}

try{

    const ref =
    doc(db,"vip_clientas",email);

    const snap =
    await getDoc(ref);

    if(!snap.exists()){

        loader.style.display = "none";

        return alert("Cuenta no encontrada");
    }

    let data = snap.data();

    if(data.pass !== pass){

        loader.style.display = "none";

        return alert("Contraseña incorrecta");
    }

    if(!data.aprobada){

        loader.style.display = "none";

        return alert("⏳ Tu cuenta aún no ha sido aprobada");
    }

    sessionStorage.setItem("vip",email);

    loader.innerHTML = "💖 Bienvenida...";

    setTimeout(()=>{

        window.location = "vip.html";

    },1000);

}catch(error){

    console.error(error);

    loader.style.display = "none";

    alert("❌ Error al iniciar sesión");

}

};

</script>
<script src="a.js"></script>
<script>
// 📱 MENÚ MOBILE
function toggleMenu() {
    document.querySelector("nav").classList.toggle("active");
}
</script>
</body>
</html>
